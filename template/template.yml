education:
  - title: PhD in Natural Language Processing
    institution: University of Strasbourg, LiLPa
    url: https://lilpa.unistra.fr/
    img: assets/lilpa_min.svg
    startDate: 2024-10-01T00:00:00.000Z
    endDate: 2027-10-01T00:00:00.000Z
    location: Strasbourg, France
    honors: null
    courses: null
    highlights:
      - "*Thesis*: Mitigating Gender Biases in NLP Data for French"
      - >-
        *Description*: Research focused on quantifying and mitigating gender
        biases induced by the use of masculine generics by instruct-based LLMs
        in French. Involves model evaluation, dataset augmentation, and
        development of bias mitigation techniques through steering, constrained
        decoding, and fine-tuning. Conducting psycholinguistic experiments to
        assess human perception of gender-biased and neutral outputs in an LLM
        usage context.
      - "*Supervisor*: Amalia Todirascu"
  - title: Master's in Natural Language Processing
    institution: University of Strasbourg
    url: https://www.unistra.fr/
    img: assets/unistra.svg
    startDate: 2022-09-01T00:00:00.000Z
    endDate: 2024-06-01T00:00:00.000Z
    location: Strasbourg, France
    honors: null
    courses: null
    highlights:
      - "*Grade*: 18.125/20 (GPA equiv.: 4.0). Highest Honors. Rank: 1/20."
      - >-
        *Covered Topics*: DSA; OOP; data analysis; machine learning; stats;
        Python; Java; JavaScript; PHP; SQL; R; RegExp; Bash
      - >-
        *Thesis*: Automatic Gender-Neutral Rewriting Using Human Collective
